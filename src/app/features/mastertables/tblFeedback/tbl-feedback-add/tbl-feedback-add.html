<!-- Path: src/app/features/mastertables/tblFeedback/tbl-feedback-add/tbl-feedback-add.html -->
<div class="container grid-page-shell">

	<div class="page-header-bar-simple">
		<h1 class="page-caption">Add Feedback</h1>
	</div>

	<form #form="ngForm" novalidate>

		<div class="page-card">

            <!-- Set from gbProfile; not editable or selectable. API must verify claims. -->
            <input type="hidden" name="fldFKProfileId" [(ngModel)]="model.fldFKProfileId">
            <input type="hidden" name="fldUserType" [(ngModel)]="model.fldUserType">
            <p class="text-danger" role="alert" *ngIf="sessionError">{{ sessionError }}</p>
            <p class="text-danger" role="alert" *ngIf="validationMessage">{{ validationMessage }}</p>

			<div class="d-flex flex-row form-row">
				<div class="col-3 field-group">
					<label class="form-label" for="fldCategory">Category</label>
					<select id="fldCategory" class="form-control" name="fldCategory" [(ngModel)]="model.fldCategory" (ngModelChange)="onCategoryChange()" required>
						<option value="">-- Select --</option>
						@for (c of categories; track c) {
						<option [value]="c">{{ c }}</option>
						}
					</select>
					<div class="text-danger" *ngIf="form.controls['fldCategory']?.touched && form.controls['fldCategory']?.invalid">
						Category is required.
					</div>
				</div>
				<div class="col-3 field-group">
					<label class="form-label" for="fldFeedbackType">Feedback Type</label>
					<select id="fldFeedbackType" class="form-control" name="fldFeedbackType" [(ngModel)]="model.fldFeedbackType" required>
						<option value="">-- Select --</option>
						@for (t of feedbackTypes; track t) {
						<option [value]="t">{{ t }}</option>
						}
					</select>
					<div class="text-danger" *ngIf="form.controls['fldFeedbackType']?.touched && form.controls['fldFeedbackType']?.invalid">
						Feedback Type is required.
					</div>
				</div>
			</div>

			<div class="d-flex flex-row form-row">
				<div class="col-3 field-group">
					<label class="form-label" for="fldMenuName">Menu Name</label>
					<input type="text" id="fldMenuName" class="form-control" name="fldMenuName" [(ngModel)]="model.fldMenuName" maxlength="100" [required]="model.fldCategory === 'Existing Feature'">
					<div class="text-danger" *ngIf="form.controls['fldMenuName']?.touched && form.controls['fldMenuName']?.invalid">
						Menu Name is required for Existing Feature feedback.
					</div>
				</div>
				<div class="col-3 field-group">
					<label class="form-label" for="fldFeatureName">Feature Name</label>
					<input type="text" id="fldFeatureName" class="form-control" name="fldFeatureName" [(ngModel)]="model.fldFeatureName" maxlength="100">
				</div>
			</div>

			<div class="d-flex flex-row form-row">
				<div class="col-3 field-group">
					<label class="form-label" for="fldSubject">Subject</label>
					<input type="text" id="fldSubject" class="form-control" name="fldSubject" [(ngModel)]="model.fldSubject" maxlength="200" required>
					<div class="text-danger" *ngIf="form.controls['fldSubject']?.touched && form.controls['fldSubject']?.invalid">
						Subject is required.
					</div>
				</div>
				<div class="col-3 field-group">
					<label class="form-label" for="fldAppVersion">App Version</label>
					<input type="text" id="fldAppVersion" class="form-control" name="fldAppVersion" [(ngModel)]="model.fldAppVersion" maxlength="50" readonly aria-readonly="true">
				</div>
			</div>

			<div class="d-flex flex-row form-row">
				<div class="col-3 field-group">
					<label class="form-label" for="fldDescription">Description</label>
					<textarea id="fldDescription" class="form-control" name="fldDescription" rows="4" [(ngModel)]="model.fldDescription" maxlength="4000" required></textarea>
					<div class="text-danger" *ngIf="form.controls['fldDescription']?.touched && form.controls['fldDescription']?.invalid">
						Description is required.
					</div>
				</div>
				<div class="col-3 field-group">
					<label class="form-label" for="fldAttachmentPath">Attachment Path</label>
					<input type="text" id="fldAttachmentPath" class="form-control" name="fldAttachmentPath" [(ngModel)]="model.fldAttachmentPath" maxlength="1000">
				</div>
			</div>

			<div class="d-flex flex-row form-row">
				<div class="col-3 field-group">
					<label class="form-label" for="fldStatus">Status</label>
					<select id="fldStatus" class="form-control" name="fldStatus" [(ngModel)]="model.fldStatus" disabled>
						@for (s of statuses; track s) {
						<option [value]="s">{{ s }}</option>
						}
					</select>
				</div>
            </div>

		</div>

		<div class="page-actions-bar">
			<button type="button" (click)="OnFormSubmit(form, 'SaveAndAddNew')" class="btn-app btn-save" [disabled]="isSaving || !!sessionError">
				<i class="bi bi-floppy"></i>
				Save &amp; Add New
			</button>
			<button type="button" (click)="OnFormSubmit(form, 'SaveAndClose')" class="btn-app btn-new" [disabled]="isSaving || !!sessionError">
				<i class="bi bi-check2-circle"></i>
				Save &amp; Close
			</button>
			<button type="button" (click)="backToHome()" class="btn-app btn-dark">
				<i class="bi bi-arrow-left"></i>
				Back
			</button>
		</div>

	</form>


</div>
