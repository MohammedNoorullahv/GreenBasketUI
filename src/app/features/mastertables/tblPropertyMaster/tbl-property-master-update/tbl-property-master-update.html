<!-- Path: src/app/features/mastertables/tblPropertyMaster/tbl-property-master-update/tbl-property-master-update.html -->
<div class="container grid-page-shell">

    <div class="page-header-bar-simple">
        <h1 class="page-caption">{{ actionType }} Property Master</h1>
    </div>

    <ng-container *ngIf="tblPropertyMaster; else notFound">

        <form #form="ngForm" novalidate>

            <div class="page-card">

                <div class="d-flex flex-row form-row">
                    <div class="col-3 field-group">
                        <label class="form-label" for="fldSlNo">Sl No <span class="required">*</span></label>
                        <input type="number" id="fldSlNo" class="form-control" name="fldSlNo"
                            [(ngModel)]="tblPropertyMaster.fldSlNo" step="1" min="1" required>
                        <div class="text-danger"
                            *ngIf="form.controls['fldSlNo']?.touched && form.controls['fldSlNo']?.invalid">
                            Sl No is required and should be greater than 0.
                        </div>
                    </div>
                    <div class="col-3 field-group">
                        <label class="form-label" for="fldDescription">Description <span class="required">*</span></label>
                        <input type="text" id="fldDescription" class="form-control" name="fldDescription"
                            [(ngModel)]="tblPropertyMaster.fldDescription" maxlength="30" required>
                        <div class="text-danger"
                            *ngIf="form.controls['fldDescription']?.touched && form.controls['fldDescription']?.invalid">
                            Description is required.
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-row form-row">
                    <div class="col-3 field-group">
                        <label class="form-label" for="fldShortName">Short Name</label>
                        <input type="text" id="fldShortName" class="form-control" name="fldShortName"
                            [(ngModel)]="tblPropertyMaster.fldShortName" maxlength="10">
                    </div>
                </div>

                <input id="fldId" name="fldId" [(ngModel)]="tblPropertyMaster.fldId" hidden>
                <input id="fldIsActive" name="fldIsActive" [(ngModel)]="tblPropertyMaster.fldIsActive" hidden>
                <input id="fldCreatedBy" name="fldCreatedBy" [(ngModel)]="tblPropertyMaster.fldCreatedBy" hidden>
                <input id="fldCreatedDt" name="fldCreatedDt" [(ngModel)]="tblPropertyMaster.fldCreatedDt" hidden>

            </div>

            <div class="page-actions-bar">
                <button type="button" (click)="OnFormSubmit(form)" class="btn-app btn-save"
                    [disabled]="actionType !== 'Edit' || isSaving">
                    <i class="bi bi-floppy"></i>
                    Save
                </button>
                <button type="button" (click)="OnFormSubmit(form)" class="btn-app btn-delete"
                    [disabled]="actionType !== 'Delete' || isSaving">
                    <i class="bi bi-trash3"></i>
                    Delete
                </button>
                <button type="button" (click)="backToHome()" class="btn-app btn-back">
                    <i class="bi bi-arrow-left"></i>
                    Back
                </button>
            </div>

        </form>

    </ng-container>

    <ng-template #notFound>
        <div class="page-card">
            <div class="alert alert-warning mb-0" role="alert">
                Property Master not found
            </div>
        </div>
    </ng-template>

</div>
