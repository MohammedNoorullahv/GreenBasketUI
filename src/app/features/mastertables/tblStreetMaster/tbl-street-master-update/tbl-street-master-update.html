<div class="container grid-page-shell">
	<!-- ============================================
		 Section 1: Caption
		 ============================================ -->
	<div class="page-header-bar-simple">
		<h1 class="page-caption">{{ actionType }} Street Masters</h1>
	</div>

	<ng-container *ngIf="tblStreetMaster; else notFound">

		<form #form="ngForm" novalidate>

			<!-- ============================================
				 Section 2: Input fields
				 ============================================ -->
			<div class="page-card">

				<div class="d-flex flex-row form-row">
					<div class="col-3 field-group">
						<label class="form-label" for="fldFKCity">F K City</label>
						<select id="fldFKCity" class="form-select" name="fldFKCity" [(ngModel)]="tblStreetMaster.fldFKCity" required>
							<option value="">-- Select --</option>
							<!-- <option *ngFor="let tblCityorTownMaster of tblCityorTownMaster$ | async" [value]="tblCityorTownMaster.fldId"> {{ <tblCityorTownMaster class="FldCityorTown"></tblCityorTownMaster> }}</option> -->
                            <option *ngFor="let tblCityorTownMaster of tblCityorTownMaster$ | async" [value]="tblCityorTownMaster.fldId">{{ tblCityorTownMaster.fldCityorTownName }}</option>
						</select>
						<div class="text-danger" *ngIf="form.controls['fldFKCity']?.touched && form.controls['fldFKCity']?.invalid">
							F K City is required and should be greater than 0.
						</div>
					</div>
					<div class="col-3 field-group">
						<label class="form-label" for="fldStreetName">Street Name</label>
						<input type="text" id="fldStreetName" class="form-control" name="fldStreetName" [(ngModel)]="tblStreetMaster.fldStreetName" maxlength="100" required>
						<div class="text-danger" *ngIf="form.controls['fldStreetName']?.touched && form.controls['fldStreetName']?.invalid">
							Street Name is required.
						</div>
					</div>
				</div>

				<input id="fldId" name="fldId" [(ngModel)]="tblStreetMaster.fldId" hidden>
				<input id="fldIsActive" name="fldIsActive" [(ngModel)]="tblStreetMaster.fldIsActive" hidden>
				<input id="fldCreatedBy" name="fldCreatedBy" [(ngModel)]="tblStreetMaster.fldCreatedBy" hidden>
				<input id="fldCreatedDt" name="fldCreatedDt" [(ngModel)]="tblStreetMaster.fldCreatedDt" hidden>

			</div>

			<!-- ============================================
				 Section 3: Command buttons
				 ============================================ -->
			<div class="page-actions-bar">
				<button type="button" (click)="submitAction = 'Edit'; OnFormSubmit(form)" class="btn-app btn-save" [disabled]="actionType !== 'Edit'">
					<i class="bi bi-floppy"></i>
					Save
				</button>
				<button type="button" (click)="submitAction = 'Delete'; OnFormSubmit(form)" class="btn-app btn-delete" [disabled]="actionType !== 'Delete'">
					<i class="bi bi-trash3"></i>
					Delete
				</button>
				<button type="button" (click)="backToHome()" class="btn-app btn-dark">
					<i class="bi bi-arrow-left"></i>
					Back
				</button>
			</div>

		</form>

	</ng-container>

	<ng-template #notFound>
		<div class="page-card">
			<div class="alert alert-warning mb-0" role="alert">
				TblStreetMaster Not Found
			</div>
		</div>
	</ng-template>

</div>
