<div class="container grid-page-shell">
	<!-- ============================================
		 Section 1: Caption
		 ============================================ -->
	<div class="page-header-bar-simple">
        <i class="bi bi-buildings page-caption-icon"></i>
		<h1 class="page-caption">{{ actionType }} City / Town Masters</h1>
	</div>

	<ng-container *ngIf="tblCityorTownMaster; else notFound">

		<form #form="ngForm" novalidate>

			<!-- ============================================
				 Section 2: Input fields
				 ============================================ -->
			<div class="page-card">

				<div class="d-flex flex-row form-row">
					<div class="col-3 field-group">
						<label class="form-label" for="fldCityorTownName">Cityor Town Name</label>
						<input type="text" id="fldCityorTownName" class="form-control" name="fldCityorTownName" [(ngModel)]="tblCityorTownMaster.fldCityorTownName" maxlength="100" required>
						<div class="text-danger" *ngIf="form.controls['fldCityorTownName']?.touched && form.controls['fldCityorTownName']?.invalid">
							Cityor Town Name is required.
						</div>
					</div>
					<div class="col-3 field-group">
						<label class="form-label" for="fldAreaName">Area Name</label>
						<input type="text" id="fldAreaName" class="form-control" name="fldAreaName" [(ngModel)]="tblCityorTownMaster.fldAreaName" maxlength="50">
					</div>
				</div>

				<div class="d-flex flex-row form-row">
					<div class="col-3 field-group">
						<label class="form-label" for="fldPincode">Pincode</label>
						<input type="text" id="fldPincode" class="form-control" name="fldPincode" [(ngModel)]="tblCityorTownMaster.fldPincode" maxlength="6" required>
						<div class="text-danger" *ngIf="form.controls['fldPincode']?.touched && form.controls['fldPincode']?.invalid">
							Pincode is required.
						</div>
					</div>
				</div>

				<input id="fldId" name="fldId" [(ngModel)]="tblCityorTownMaster.fldId" hidden>
				<input id="fldIsActive" name="fldIsActive" [(ngModel)]="tblCityorTownMaster.fldIsActive" hidden>
				<input id="fldCreatedBy" name="fldCreatedBy" [(ngModel)]="tblCityorTownMaster.fldCreatedBy" hidden>
				<input id="fldCreatedDt" name="fldCreatedDt" [(ngModel)]="tblCityorTownMaster.fldCreatedDt" hidden>

			</div>

			<!-- ============================================
				 Section 3: Command buttons
				 ============================================ -->
			<div class="page-actions-bar">
				<button type="button" (click)="submitAction = 'Edit'; OnFormSubmit(form)" class="btn-app btn-save" [disabled]="actionType !== 'Edit'">
					<i class="bi bi-floppy"></i>
					Save
				</button>
				<button type="button" (click)="submitAction = 'Delete'; OnFormSubmit(form)" class="btn-app btn-delete" [disabled]="actionType !== 'Delete'">
					<i class="bi bi-trash3"></i>
					Delete
				</button>
				<button type="button" (click)="backToHome()" class="btn-app btn-dark">
					<i class="bi bi-arrow-left"></i>
					Back
				</button>
			</div>

		</form>

	</ng-container>

	<ng-template #notFound>
		<div class="page-card">
			<div class="alert alert-warning mb-0" role="alert">
				TblCityorTownMaster Not Found
			</div>
		</div>
	</ng-template>

</div>
