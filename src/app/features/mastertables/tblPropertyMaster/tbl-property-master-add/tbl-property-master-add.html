<!-- Path: src/app/features/mastertables/tblPropertyMaster/tbl-property-master-add/tbl-property-master-add.html -->
<div class="container grid-page-shell">

    <div class="page-header-bar-simple">
        <h1 class="page-caption">Add Property Master</h1>
    </div>

    <form #form="ngForm" novalidate>

        <div class="page-card">

            <div class="d-flex flex-row form-row">
                <div class="col-3 field-group">
                    <label class="form-label" for="fldSlNo">Sl No <span class="required">*</span></label>
                    <input type="number" id="fldSlNo" class="form-control" name="fldSlNo" [(ngModel)]="model.fldSlNo"
                        step="1" min="1" required>
                    <div class="text-danger" *ngIf="form.controls['fldSlNo']?.touched && form.controls['fldSlNo']?.invalid">
                        Sl No is required and should be greater than 0.
                    </div>
                </div>
                <div class="col-3 field-group">
                    <label class="form-label" for="fldDescription">Description <span class="required">*</span></label>
                    <input type="text" id="fldDescription" class="form-control" name="fldDescription"
                        [(ngModel)]="model.fldDescription" maxlength="30" required>
                    <div class="text-danger"
                        *ngIf="form.controls['fldDescription']?.touched && form.controls['fldDescription']?.invalid">
                        Description is required.
                    </div>
                </div>
            </div>

            <div class="d-flex flex-row form-row">
                <div class="col-3 field-group">
                    <label class="form-label" for="fldShortName">Short Name</label>
                    <input type="text" id="fldShortName" class="form-control" name="fldShortName"
                        [(ngModel)]="model.fldShortName" maxlength="10">
                </div>
            </div>

        </div>

        <div class="page-actions-bar">
            <button type="button" (click)="OnFormSubmit(form, 'SaveAndAddNew')" class="btn-app btn-save"
                [disabled]="isSaving">
                <i class="bi bi-floppy"></i>
                Save &amp; Add New
            </button>
            <button type="button" (click)="OnFormSubmit(form, 'SaveAndClose')" class="btn-app btn-new"
                [disabled]="isSaving">
                <i class="bi bi-check2-circle"></i>
                Save &amp; Close
            </button>
            <button type="button" (click)="backToHome()" class="btn-app btn-back">
                <i class="bi bi-arrow-left"></i>
                Back
            </button>
        </div>

    </form>

</div>
