<!-- Path: src/app/features/mastertables/tblProperty/tbl-property-update/tbl-property-update.html -->
<div class="container grid-page-shell">

    <div class="page-header-bar-simple">
        <h1 class="page-caption">{{ actionType }} Property</h1>
    </div>

    <ng-container *ngIf="tblProperty; else notFound">

        <form #form="ngForm" novalidate>

            <div class="page-card">

            <div class="d-flex flex-row form-row">
                <div class="col-3 field-group">
                    <label class="form-label" for="fldFKProperty">Property Master <span class="required">*</span></label>
                    <select id="fldFKProperty" class="form-select form-control" name="fldFKProperty"
                        [(ngModel)]="tblProperty.fldFKProperty" required>
                        <option [ngValue]="0">-- Select --</option>
                        @for (pm of (tblPropertyMaster$ | async); track pm.fldId) {
                        <option [ngValue]="pm.fldId">{{ pm.fldDescription }}</option>
                        }
                    </select>
                    <div class="text-danger"
                        *ngIf="form.controls['fldFKProperty']?.touched && (!tblProperty.fldFKProperty || tblProperty.fldFKProperty <= 0)">
                        Property Master is required.
                    </div>
                </div>
                <div class="col-3 field-group">
                    <label class="form-label" for="fldSlNo">Sl No <span class="required">*</span></label>
                    <input type="number" id="fldSlNo" class="form-control" name="fldSlNo" [(ngModel)]="tblProperty.fldSlNo"
                        step="1" min="1" required>
                    <div class="text-danger" *ngIf="form.controls['fldSlNo']?.touched && form.controls['fldSlNo']?.invalid">
                        Sl No is required and should be greater than 0.
                    </div>
                </div>
            </div>

            <div class="d-flex flex-row form-row">
                <div class="col-3 field-group">
                    <label class="form-label" for="fldDescription">Description <span class="required">*</span></label>
                    <input type="text" id="fldDescription" class="form-control" name="fldDescription"
                        [(ngModel)]="tblProperty.fldDescription" maxlength="100" pattern="[0-9a-zA-Z]+" required>
                    <div class="text-danger"
                        *ngIf="form.controls['fldDescription']?.touched && form.controls['fldDescription']?.errors?.['required']">
                        Description is required.
                    </div>
                    <div class="text-danger"
                        *ngIf="form.controls['fldDescription']?.touched && form.controls['fldDescription']?.errors?.['pattern']">
                        Description Must be AlphaNumeric.
                    </div>
                </div>
                <div class="col-3 field-group">
                    <label class="form-label" for="fldShortName">Short Name</label>
                    <input type="text" id="fldShortName" class="form-control" name="fldShortName"
                        [(ngModel)]="tblProperty.fldShortName" maxlength="30" pattern="[0-9a-zA-Z]*">
                    <div class="text-danger"
                        *ngIf="form.controls['fldShortName']?.touched && form.controls['fldShortName']?.errors?.['pattern']">
                        Short Name Must be AlphaNumeric.
                    </div>
                </div>
            </div>

            <div class="d-flex flex-row form-row">
                <div class="col-3 field-group">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="fldSetAsDefault"
                            name="fldSetAsDefault" [(ngModel)]="tblProperty.fldSetAsDefault">
                        <label class="form-check-label" for="fldSetAsDefault">Set As Default</label>
                    </div>
                </div>
            </div>

                <input id="fldId" name="fldId" [(ngModel)]="tblProperty.fldId" hidden>
                <input id="fldIsActive" name="fldIsActive" [(ngModel)]="tblProperty.fldIsActive" hidden>
                <input id="fldCreatedBy" name="fldCreatedBy" [(ngModel)]="tblProperty.fldCreatedBy" hidden>
                <input id="fldCreatedDt" name="fldCreatedDt" [(ngModel)]="tblProperty.fldCreatedDt" hidden>

            </div>

            <div class="page-actions-bar">
                <button type="button" (click)="OnFormSubmit(form)" class="btn-app btn-save"
                    [disabled]="actionType !== 'Edit' || isSaving">
                    <i class="bi bi-floppy"></i>
                    Save
                </button>
                <button type="button" (click)="OnFormSubmit(form)" class="btn-app btn-delete"
                    [disabled]="actionType !== 'Delete' || isSaving">
                    <i class="bi bi-trash3"></i>
                    Delete
                </button>
                <button type="button" (click)="backToHome()" class="btn-app btn-back">
                    <i class="bi bi-arrow-left"></i>
                    Back
                </button>
            </div>

        </form>

    </ng-container>

    <ng-template #notFound>
        <div class="page-card">
            <div class="alert alert-warning mb-0" role="alert">
                Property not found
            </div>
        </div>
    </ng-template>

</div>
